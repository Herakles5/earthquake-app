name: Update hotspots

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday 03:00 UTC
  workflow_dispatch:       # also startable by hand (Actions tab -> Run workflow)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build hotspots.json
        run: python3 hotspot_builder.py hotspots.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add hotspots.json
          git diff --cached --quiet || (git commit -m "Update hotspots (weekly)" && git push)
